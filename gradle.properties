android.nonTransitiveRClass=false
android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

# === Build Performance Optimization ===
# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# JVM: 6GB heap (system has 16GB), parallel GC, faster file encoding
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin: faster compilation
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC

# Android: faster builds
android.enableBuildCache=true
